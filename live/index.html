<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinPick Live</title><meta name="robots" content="noindex">
<link rel="icon" href="https://finpick.in/assets/favicona.png">

<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#14213D;color:#F4EFE6;font-family:Mukta,'Noto Sans Devanagari',Arial,sans-serif;text-align:center;padding:16px}
.l{font-weight:700;font-size:34px}.f{color:#F7931E}.p{color:#6FA8F0}p{color:#C9D6E8;font-size:18px}a{color:#F2A365}</style></head>
<body><div><div style="background:#fff;display:inline-block;border-radius:14px;padding:10px 18px;margin-bottom:10px"><img src="/live/finpick-logo.png" alt="FinPick" style="height:44px;display:block"></div><div class="l">Saturday Live</div>
<p id="msg">तुमची Live room उघडत आहे…</p><div id="cd" style="display:none;font-size:40px;font-weight:700;color:#F2A365;letter-spacing:2px;margin:6px 0"></div><p id="sub" style="font-size:15px">या शनिवारी संध्या. 6:00 वा. · नाव टाकून "Join" / "Ask to join" दाबा</p><p id="manual"><a href="https://meet.google.com/jqn-hzha-ktb">उघडली नाही तर इथे click करा</a></p></div>
<script>
(function(){
  var MEET="https://meet.google.com/jqn-hzha-ktb";
  // Attendance: emails link here as /live/?l=<Zoho lead id>
  var id=new URLSearchParams(location.search).get("l");
  // Gate: Meet opens only Saturday 17:55-19:30 IST (host joins 17:45)
  function ist(){var n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+330*60000)}
  function openNow(){var t=ist();var m=t.getHours()*60+t.getMinutes();return t.getDay()===6&&m>=17*60+55&&m<19*60+30}
  function nextStart(){var t=ist();var d=new Date(t);var add=(6-t.getDay()+7)%7;d.setDate(t.getDate()+add);d.setHours(17,55,0,0);if(d<=t||(t.getDay()===6&&(t.getHours()*60+t.getMinutes())>=19*60+30)){d.setDate(d.getDate()+7)}return d}
  var went=false;
  var go=function(){if(went)return;went=true;var delay=600;
    if(id && /^\d{10,25}$/.test(id)){delay=1200;
      try{localStorage.setItem("fp_lead",id)}catch(e){}
      try{fetch("https://project-rainfall-60087439549.development.catalystserverless.in/server/lp_lead/?att="+id,{method:"POST",headers:{"Content-Type":"text/plain"},body:"{}",keepalive:true}).catch(function(){})}catch(e){}
    }
    setTimeout(function(){location.replace(MEET)},delay)};
  var TEST=new URLSearchParams(location.search).get("test")==="1";
  if(TEST||openNow()){
    go();return}
  document.getElementById("msg").textContent="Live सुरू होईल शनिवारी संध्या. 6:00 वा.";
  document.getElementById("sub").textContent="ही page उघडी ठेवा. वेळ झाली की Live room आपोआप उघडेल.";
  document.getElementById("manual").style.display="none";
  var cd=document.getElementById("cd");cd.style.display="block";
  var target=nextStart();
  function tick(){var t=ist();var s=Math.max(0,Math.floor((target-t)/1000));if(s===0||openNow()){go();return}
    var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),mi=Math.floor(s%3600/60),se=s%60;
    cd.textContent=(d?d+" दिवस ":"")+String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0")+":"+String(se).padStart(2,"0")}
  tick();setInterval(tick,1000);
})();
</script>
</body></html>
