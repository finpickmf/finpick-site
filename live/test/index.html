<!doctype html>
<html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinPick Saturday Live</title><meta name="robots" content="noindex">
<link rel="icon" href="https://finpick.in/assets/favicona.png">
<style>
:root{--navy:#0E1830;--card:#14213D;--ink:#F4EFE6;--muted:#C9D6E8;--orange:#E8742A;--blue:#0B4EA8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--navy);color:var(--ink);font-family:Mukta,'Noto Sans Devanagari','Nirmala UI',Arial,sans-serif}
header{background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header img{height:38px;display:block}
.live{display:inline-flex;align-items:center;gap:8px;background:var(--orange);color:#fff;font-weight:700;font-size:14px;letter-spacing:1px;padding:6px 12px;border-radius:30px}
.dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:p 1.2s infinite}@keyframes p{50%{opacity:.25}}
main{max-width:1100px;margin:0 auto;padding:14px 12px 28px}
h1{font-size:20px;line-height:1.35;margin:4px 2px 12px;font-weight:700}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:700px){.player{aspect-ratio:auto;height:52vh}}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{flex:1 1 220px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:16px;padding:13px 14px;border-radius:12px}
.wa{background:#1FA855;color:#fff}.pdf{background:var(--card);color:var(--ink);border:1px solid #33456E}
.tip{color:var(--muted);font-size:14px;margin:12px 2px 0;line-height:1.5}
.tip a{color:#F2A365}
footer{color:#6F7F9F;font-size:12px;text-align:center;padding:10px}
</style></head>
<body>
<header><img src="/live/finpick-logo.png" alt="FinPick"><span class="live"><span class="dot"></span>SATURDAY LIVE</span></header>
<main>
<h1>तुमची Health Policy खरंच पुरेशी आहे का? · Host: निखिल गौड</h1>
<div class="player"><iframe id="pl" title="FinPick Saturday Live" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe></div>
<div class="row">
<a class="btn wa" id="wa" href="#">💬 प्रश्न विचारा (WhatsApp)</a>
<a class="btn pdf" href="/live/policy-check-sheet.pdf" target="_blank">📄 Health Policy Check Sheet</a>
</div>
<p class="tip">Video सुरू होत नसेल तर: page एकदा refresh करा, आवाज (unmute) चालू करा. तरीही अडचण आली तर <a id="alt" href="#" target="_blank">इथे click करा</a>.</p>
</main>
<footer>FinPick · शैक्षणिक सत्र</footer>
<script>
(function(){
  var WID="cmwiv5hma012cs60yo6ks9e9i";
  document.getElementById("pl").src="https://webinar.gg/embed/"+WID;
  document.getElementById("alt").href="https://webinar.gg/webinar-page/"+WID;
  document.getElementById("wa").href="https://wa.me/918265083354?text="+encodeURIComponent("Saturday Live प्रश्न: ");
  // Attendance: links like /live/?l=<Zoho lead id>
  var id=new URLSearchParams(location.search).get("l");
  if(!id){try{id=localStorage.getItem("fp_lead")}catch(e){}}
  if(id && /^\d{10,25}$/.test(id)){
    try{localStorage.setItem("fp_lead",id)}catch(e){}
    try{fetch("https://project-rainfall-60087439549.development.catalystserverless.in/server/lp_lead/?att="+id,{method:"POST",headers:{"Content-Type":"text/plain"},body:"{}",keepalive:true}).catch(function(){})}catch(e){}
  }
})();
</script>
</body></html>
